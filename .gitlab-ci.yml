# .gitlab-ci.yml
#
# Four stages: validate -> build and push the image -> deploy, plus a manual
# training job that does not run on every push.
#
# Required project/group variables in GitLab (Settings > CI/CD > Variables,
# protected and masked). They carry account data, so they are not versioned:
#   AWS_ACCOUNT_ID
#   RDS_ENDPOINT   (host:port, `terraform output -raw rds_endpoint`)
#
# No runner `tags:`: any shared or project runner can pick the jobs up.

variables:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "dlinear-forecast-api"
  EKS_CLUSTER_NAME: "dlinear-forecast-cluster-eks"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"
  # MLflow (kubernetes/base/mlflow.yaml) is a ClusterIP Service, resolvable only
  # INSIDE the cluster; see the note on the "train" job below.
  MLFLOW_TRACKING_URI: "http://mlflow.dlinear-production.svc.cluster.local:5000"

stages:
  - lint_test
  - build_push
  - deploy
  - train

# OIDC authentication to AWS: temporary credentials through GitLabCI_OIDC_Role
# (terraform/iam.tf), with no long-lived access key stored as a CI variable.
.aws-auth:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - |
      if ! command -v aws >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache aws-cli >/dev/null
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq awscli >/dev/null
        fi
      fi
    - >
      STS_OUTPUT=$(aws sts assume-role-with-web-identity
      --role-arn arn:aws:iam::${AWS_ACCOUNT_ID}:role/GitLabCI_OIDC_Role
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token ${GITLAB_OIDC_TOKEN}
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$STS_OUTPUT" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$STS_OUTPUT" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "$STS_OUTPUT" | awk '{print $3}')

# ========================
# Format + lint + unit tests (api/ and core_ml/): the same `make ci` that runs
# locally before a push.
# ========================
lint_test:
  stage: lint_test
  image: python:3.10
  cache:
    key: "poetry-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - .cache/poetry
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make
    - pip install --no-cache-dir poetry==1.8.3
  script:
    - make install
    # `make ci` = format-check + lint + test, exactly what runs locally.
    - make ci
  rules:
    - if: $CI_COMMIT_BRANCH

# ========================
# Build the API image and push it to ECR (it serves both the HTTP endpoint and
# the batch-inference CronJob).
# ========================
build_push:
  stage: build_push
  extends: .aws-auth
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - apk add --no-cache aws-cli
    # The dind service is sometimes not accepting connections yet when the
    # script starts: wait for it instead of assuming it is ready.
    - i=0; until docker info >/dev/null 2>&1 || [ $i -ge 30 ]; do i=$((i+1)); sleep 2; done
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA -f Dockerfile .
    - docker push $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ========================
# Direct kubectl deploy: set the image tag and config with kustomize and apply
# the manifests. alpine/k8s ships kubectl, aws-cli and kustomize.
# ========================
deploy:
  stage: deploy
  extends: .aws-auth
  image: alpine/k8s:1.30.13
  needs: ["build_push"]
  script:
    - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION
    - cd kubernetes/overlays/production
    - test -n "$RDS_ENDPOINT" || { echo "Missing CI variable RDS_ENDPOINT"; exit 1; }
    - kustomize edit set configmap dlinear-config --from-literal=MODEL_BUCKET_NAME=dlinear-forecast-cluster-model-artifacts-${AWS_ACCOUNT_ID} --from-literal=RDS_ENDPOINT=${RDS_ENDPOINT}
    - kustomize edit set image dlinear-api=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHA
    - kubectl apply -k .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ========================
# Manual training: train, run the quality gate (against the current
# "production" version in the Model Registry) and promote if the candidate is
# better. Triggered by hand from the GitLab UI when there is new data.
#
# Known limitation: MLFLOW_TRACKING_URI points at MLflow's internal Service,
# resolvable only INSIDE the cluster's VPC. GitLab.com shared runners cannot
# reach it, so running this job as is needs a runner with VPC access (or MLflow
# behind a reachable endpoint). For development, `make train` runs the same
# pipeline locally against the docker-compose MLflow.
# ========================
train:
  stage: train
  extends: .aws-auth
  image: python:3.10
  before_script:
    - !reference [.aws-auth, before_script]
    - pip install --no-cache-dir poetry==1.8.3
  script:
    - cd core_ml && poetry install --sync --no-interaction
    # .dvc/config holds a placeholder instead of the account ID.
    - poetry run dvc remote modify --local s3remote url "s3://dlinear-forecast-cluster-model-artifacts-${AWS_ACCOUNT_ID}/dvc-store"
    - poetry run dvc pull data/raw/ETTh1.csv.dvc
    - poetry run python -m src.data_processing --dataset raw
    - poetry run python -m src.train --dataset raw
    - poetry run python -m src.quality_gate
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
