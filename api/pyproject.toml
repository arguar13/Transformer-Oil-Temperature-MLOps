[tool.poetry]
name = "dlinear-mlops-api"
version = "1.0.0"
description = "Inference microservice for time-series forecasting"
authors = ["Armando Guarnera <contacto@armandoguar.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
# CPU-only (see the note in core_ml/pyproject.toml): no node here has a GPU, and
# the default PyPI wheel made this image ~8.26 GB (aws ecr describe-images), with
# real network timeouts pushing it to ECR.
torch = {version = "^2.3.0", source = "pytorch-cpu"}
mlflow = "^2.16.0"
pydantic = "^2.9.0"
numpy = ">=1.26.0,<3.0.0"
pandas = "^2.2.0"
joblib = "^1.4.2"
boto3 = "^1.34.0"
scikit-learn = "^1.5.0"

# Observability and resilience
structlog = "^26.1.0"
tenacity = "^9.1.4"
pybreaker = "^1.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
mypy = "^1.11.0"
ruff = "^0.6.9"
boto3-stubs = {extras = ["s3"], version = "^1.34.0"}
pandas-stubs = "^2.2.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------
# Quality tools: ruff is linter + formatter (replacing black/isort), import
# order included (rule "I").
# ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
# 3.12, not 3.10: the runtime stays on Python 3.10 (python:3.10-slim and
# `python = "^3.10"`); this only sets the syntax mypy may assume. With 3.10,
# numpy>=2.5's stubs (PEP 695 `type X = ...`) fail to parse with "Type statement
# is only supported in Python 3.12 and greater", a false positive from the stubs.
# Ruff (target-version=py310) and the real 3.10 runs in CI still catch any
# 3.10-incompatible syntax.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra -q --cov=api --cov-report=term-missing"
